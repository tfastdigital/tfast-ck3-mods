l_english: tfast_sct_dragon_egg_modifier:0 "Dragon's Egg"
  tfast_sct_dragon_egg_modifier_desc:0 "A dragon's egg lies in the cradle."
  tfast_sct_dragonbound_modifier:0 "Dragonbound"
  tfast_sct_dragonbound_modifier_desc:0 "A hatchling was born to this Targaryen and bonded to them."
  tfast_sct_valyrian_blade_modifier:0 "Valyrian Steel Heirloom"
  tfast_sct_valyrian_blade_modifier_desc:0 "The house head carries the family's Valyrian steel blade."
  tfast_sct_dragon_throne_modifier:0 "The Dragon Throne"
  tfast_sct_resisting_hollow_modifier:0 "Standing Against the Hollow"
  tfast_sct_dragon_court_modifier:0 "A Dragon at Court"
  tfast_sct_dragon_court_modifier_desc:0 "A dragonbound Targaryen lives at this court, and the world takes notice."
  tfast_sct_hollow_winter_modifier:0 "The Hollow Winter"
  tfast_sct_hollow_winter_modifier_desc:0 "A winter that does not end. Supply runs short and nerves fray."
  tfast_sct_coalition_opinion:0 "Joined my coalition"
  tfast_sct.0050.t:0 "Pale Riders"
  tfast_sct.0050.desc:0 "Travellers speak of pale riders at the edge of the map. They say the Hollow reach further every year."
  tfast_sct.0050.a:0 "A dark omen."
  tfast_sct.0050.b:0 "Post extra watches."
  tfast_sct.0051.t:0 "A Quiet Watch"
  tfast_sct.0051.desc:0 "The watches see nothing, and your men grow bolder for it."
  tfast_sct.0051.a:0 "Good."
  tfast_sct.0060.t:0 "The Hollow Winter"
  tfast_sct.0060.desc:0 "The snow comes early and stays. Every realm feels the cold the Hollow carry with them."
  tfast_sct.0060.a:0 "We will endure."
  tfast_sct_raise_coalition:0 "Raise a Coalition Against the Hollow"
  tfast_sct_raise_coalition_desc:0 "Call every independent ruler in the world to stand against the Hollow."
  tfast_sct_raise_coalition_tt:0 "Every independent ruler gains opinion of you"
  tfast_sct_resisting_hollow_modifier_desc:0 "This realm is at war with the Hollow. Its people are hardened and its name is rising."
  tfast_sct_dragon_throne_modifier_desc:0 "This Targaryen has claimed the Dragon Throne."
  tfast_sct.0002.t:0 "The Egg Hatches"
  tfast_sct.0002.desc:0 "The dragon's egg in [ROOT.Char.GetFirstName]'s cradle cracks, and a hatchling crawls out to nestle against [ROOT.Char.GetHerHis] chest."
  tfast_sct.0002.a:0 "Dracarys."
  tfast_sct.0010.t:0 "The Hollow Gather"
  tfast_sct.0010.desc:0 "Scouts report pale riders massing on the islands. The Hollow have not forgotten who killed Darkness, and they hate the blood of the dragon."
  tfast_sct.0010.a:0 "We must be ready."
  tfast_sct.0010.b:0 "Let them come."
  tfast_sct.0020.t:0 "The Blade Passes"
  tfast_sct.0020.desc:0 "The family's Valyrian steel blade passes to the new head of the house."
  tfast_sct.0020.a:0 "It is ours."
  tfast_sct.0030.t:0 "The Dragon Throne"
  tfast_sct.0030.desc:0 "You have claimed the Dragon Throne. The lords kneel, and the dragon's shadow falls across the realm."
  tfast_sct.0030.a:0 "Fire and blood."
  tfast_sct.0040.t:0 "The Hollow March"
  tfast_sct.0040.desc:0 "The Hollow Host has crossed into your lands. Darkness was killed by one of your blood, and they have come for the debt."
  tfast_sct.0040.a:0 "Then we fight."
  tfast_sct_claim_dragon_throne:0 "Claim the Dragon Throne"
  tfast_sct_claim_dragon_throne_desc:0 "As head of House Targaryen you may take the Dragon Throne for twenty years."
  tfast_sct_claim_dragon_throne_tt:0 "Gain the Dragon Throne modifier for 20 years"
