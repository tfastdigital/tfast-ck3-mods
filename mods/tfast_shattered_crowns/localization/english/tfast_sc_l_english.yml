 tfast_sc_raid_overrun_tt:0 "The raiders overrun your capital and take what they came for."
 tfast_sc_wall_held_tt:0 "The wall holds. The Host breaks on the gates."
 tfast_sc_wall_buckled_tt:0 "The wall buckles and holds. Repairs will be needed."
 tfast_sc_wall_breached_tt:0 "The gate is broken open. The wall has failed."

