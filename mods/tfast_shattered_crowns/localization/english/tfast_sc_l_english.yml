# ============================================================================
#  TFAST Shattered Crowns -- english localization             CK3 1.20.x
# ============================================================================
#  Every key that this mod references in script, traits, modifiers, men-at-
#  arms, decisions, events, game rules, religion, casus belli and toasts.
#  Keys are one-space indented, UTF-8 with BOM, per Paradox convention.
# ============================================================================

##############################################################
# GAME RULES
##############################################################
 rule_tfast_sc_reckoning_timing:0 "Shattered Crowns: The Reckoning"
 setting_tfast_sc_timing_early:0 "Early"
 setting_tfast_sc_timing_early_desc:0 "The Hollow Host comes for the world within roughly 15 years of the first raid."
 setting_tfast_sc_timing_standard:0 "Standard"
 setting_tfast_sc_timing_standard_desc:0 "The Great Reckoning is paced by the raids: three successful raids, or a lost stronghold, and the warnings begin."
 setting_tfast_sc_timing_late:0 "Late"
 setting_tfast_sc_timing_late_desc:0 "The Reckoning waits: the Host must complete five raids, or lose a stronghold, before the world is foretold."

 rule_tfast_sc_reckoning_difficulty:0 "Shattered Crowns: Hollow Host Strength"
 setting_tfast_sc_reckoning_lenient:0 "Lenient"
 setting_tfast_sc_reckoning_lenient_desc:0 "The Hollow waves are weaker and the Host recovers slowly."
 setting_tfast_sc_reckoning_standard:0 "Standard"
 setting_tfast_sc_reckoning_standard_desc:0 "The Hollow Host attacks as designed."
 setting_tfast_sc_reckoning_harrowing:0 "Harrowing"
 setting_tfast_sc_reckoning_harrowing_desc:0 "The Hollow waves are half again as strong; the Host is relentless."

 rule_tfast_sc_prophecy:0 "Shattered Crowns: The Chosen Emperor"
 setting_tfast_sc_prophecy_enabled:0 "Enabled"
 setting_tfast_sc_prophecy_enabled_desc:0 "After the first Great Reckoning, a Chosen Emperor may arise in the player dynasty, hidden until their awakening."
 setting_tfast_sc_prophecy_disabled:0 "Disabled"
 setting_tfast_sc_prophecy_disabled_desc:0 "No Chosen Emperor will ever arise. The Reckoning must be survived by ordinary means, and the Hollow immortals cannot be permanently destroyed."

##############################################################
# RELIGION
##############################################################
 hollow_communion_religion:0 "Hollow Communion"
 hollow_communion_religion_adj:0 "Hollow"
 hollow_communion_religion_adherent:0 "Hollow"
 hollow_communion_religion_adherent_plural:0 "Hollow"
 hollow_communion_religion_desc:0 "The faith of the Hollow Dynasty: closed bloodlines, patient hunger, and no god that answers."

 hollow_rite:0 "The Long Mourning"
 hollow_rite_adj:0 "Hollow"
 hollow_rite_adherent:0 "Hollow"
 hollow_rite_adherent_plural:0 "Hollow"
 hollow_rite_desc:0 "The single rite of the Hollow Communion: a perpetual mourning for a world that was taken from them."

 hollow_faith:0 "Hollow Communion"
 hollow_faith_adj:0 "Hollow"
 hollow_faith_adherent:0 "Hollow"
 hollow_faith_adherent_plural:0 "Hollow"
 hollow_faith_desc:0 "The Hollow do not worship. They wait."

##############################################################
# TRAITS
##############################################################
 trait_tfast_sc_hollow_immortal:0 "Hollow Immortal"
 trait_tfast_sc_hollow_immortal_desc:0 "One of the Hollow: unaging, unbreathing, and patient beyond mortal measure."
 trait_tfast_sc_hollow_immortal_character_desc:0 "One of the Hollow: unaging, unbreathing, and patient beyond mortal measure. Only the awakened Chosen can make a Hollow immortal truly die."
 TRAIT_FLAG_DESC_tfast_sc_hollow_immortal:0 "One of the Hollow"

 trait_tfast_sc_chosen_awakened:0 "The Awakened"
 trait_tfast_sc_chosen_awakened_desc:0 "The prophecy has opened its eyes. Whatever the Hollow are, this one is their answer."
 trait_tfast_sc_chosen_awakened_character_desc:0 "The prophecy has opened its eyes. The Awakened carries the only power in the world that can end a Hollow immortal - and the weight of every ancestor who waited for them."
 TRAIT_FLAG_DESC_tfast_sc_chosen_awakened:0 "The Awakened"

 trait_tfast_sc_wall_watchman:0 "Watchman of the Great Wall"
 trait_tfast_sc_wall_watchman_desc:0 "They have stood a night on the wall and heard the Host breathing on the other side."
 trait_tfast_sc_wall_watchman_character_desc:0 "They have stood a night on the wall and heard the Host breathing on the other side. They stayed."
 TRAIT_FLAG_DESC_tfast_sc_wall_watchman:0 "Watchman of the Great Wall"

 trait_tfast_sc_blood_vaelor:0 "Blood of Vaelor"
 trait_tfast_sc_blood_vaelor_desc:0 "The war-blood of the first son. It has never once cooled."
 trait_tfast_sc_blood_vaelor_character_desc:0 "The war-blood of Vaelor runs in them: the sword of the Hollow Dominion."
 TRAIT_FLAG_DESC_tfast_sc_blood_vaelor:0 "Blood of Vaelor"

 trait_tfast_sc_blood_morvath:0 "Blood of Morvath"
 trait_tfast_sc_blood_morvath_desc:0 "The grave gives back what it is owed, and Morvath's line keeps the ledger."
 trait_tfast_sc_blood_morvath_character_desc:0 "The blood of Morvath runs in them; the dead answer it more readily than the living do."
 TRAIT_FLAG_DESC_tfast_sc_blood_morvath:0 "Blood of Morvath"

 trait_tfast_sc_blood_kaedryn:0 "Blood of Kaedryn"
 trait_tfast_sc_blood_kaedryn_desc:0 "Where Kaedryn's line walks, the frost walks after."
 trait_tfast_sc_blood_kaedryn_character_desc:0 "The blood of Kaedryn runs in them; winter follows them like a hound."
 TRAIT_FLAG_DESC_tfast_sc_blood_kaedryn:0 "Blood of Kaedryn"

 trait_tfast_sc_blood_draven:0 "Blood of Draven"
 trait_tfast_sc_blood_draven_desc:0 "Every court has a shadow, and Draven's line lives in it."
 trait_tfast_sc_blood_draven_character_desc:0 "The blood of Draven runs in them; no door has ever stayed closed against them."
 TRAIT_FLAG_DESC_tfast_sc_blood_draven:0 "Blood of Draven"

 trait_tfast_sc_blood_tharion:0 "Blood of Tharion"
 trait_tfast_sc_blood_tharion_desc:0 "Tharion's line does not knock on gates. It opens them."
 trait_tfast_sc_blood_tharion_character_desc:0 "The blood of Tharion runs in them; walls are only stone, and stone only waits."
 TRAIT_FLAG_DESC_tfast_sc_blood_tharion:0 "Blood of Tharion"

 trait_tfast_sc_blood_seralyth:0 "Blood of Seralyth"
 trait_tfast_sc_blood_seralyth_desc:0 "Seralyth's words are still arriving at their destinations."
 trait_tfast_sc_blood_seralyth_character_desc:0 "The blood of Seralyth runs in them; a curse from their lips is a debt with no due date."
 TRAIT_FLAG_DESC_tfast_sc_blood_seralyth:0 "Blood of Seralyth"

 trait_tfast_sc_blood_nyxara:0 "Blood of Nyxara"
 trait_tfast_sc_blood_nyxara_desc:0 "Nyxara heard everything. Her line still does."
 trait_tfast_sc_blood_nyxara_character_desc:0 "The blood of Nyxara runs in them; every whisper in a realm eventually passes their ear."
 TRAIT_FLAG_DESC_tfast_sc_blood_nyxara:0 "Blood of Nyxara"

 trait_tfast_sc_blood_velmora:0 "Blood of Velmora"
 trait_tfast_sc_blood_velmora_desc:0 "Velmora keeps the promises the dead made. Her line collects them."
 trait_tfast_sc_blood_velmora_character_desc:0 "The blood of Velmora runs in them; the souls they were promised will be gathered."
 TRAIT_FLAG_DESC_tfast_sc_blood_velmora:0 "Blood of Velmora"

 trait_tfast_sc_blood_eryndra:0 "Blood of Eryndra"
 trait_tfast_sc_blood_eryndra_desc:0 "Eryndra mends what war unmakes - so that it may last to be unmade again."
 trait_tfast_sc_blood_eryndra_character_desc:0 "The blood of Eryndra runs in them; their hands rebuild, patiently, in service of the long hunger."
 TRAIT_FLAG_DESC_tfast_sc_blood_eryndra:0 "Blood of Eryndra"

 trait_tfast_sc_blood_malethra:0 "Blood of Malethra"
 trait_tfast_sc_blood_malethra_desc:0 "Malethra's line leaves ash, and ash remembers fire."
 trait_tfast_sc_blood_malethra_character_desc:0 "The blood of Malethra runs in them; they walk through ruins as through a garden."
 TRAIT_FLAG_DESC_tfast_sc_blood_malethra:0 "Blood of Malethra"

##############################################################
# MODIFIERS
##############################################################
 tfast_sc_overlord_aura_modifier:0 "The Overlord's Shadow"
 tfast_sc_overlord_aura_modifier_desc:0 "The Supreme Immortal Overlord has turned his attention to this realm. His host is at his back, and his patience is not."
 tfast_sc_overlord_sealed_modifier:0 "Sealed"
 tfast_sc_overlord_sealed_modifier_desc:0 "The Overlord is bound, displaced, or buried under his own stronghold. The Dominion gropes for direction."
 tfast_sc_host_retreat_modifier:0 "The Host Retreats"
 tfast_sc_host_retreat_modifier_desc:0 "The Hollow Host has withdrawn to its refuges to count its dead and its grudges."
 tfast_sc_court_schism_modifier:0 "Court Schism"
 tfast_sc_court_schism_modifier_desc:0 "The Court of the Ten is divided - openly and dangerously."
 tfast_sc_world_pledge_modifier:0 "World Council Pledge"
 tfast_sc_world_pledge_modifier_desc:0 "Mortal rulers have sworn before each other to resist the Hollow Host together."
 tfast_sc_chosen_power_1_modifier:0 "Awakened: First Threshold"
 tfast_sc_chosen_power_1_modifier_desc:0 "The blood wakes. Steel sits differently in the hand, and the Hollow notice."
 tfast_sc_chosen_power_2_modifier:0 "Awakened: Second Threshold"
 tfast_sc_chosen_power_2_modifier_desc:0 "The mantle settles. The Awakened moves like their ancestors, and the Hollow count their steps."
 tfast_sc_chosen_power_3_modifier:0 "Awakened: Burning Threshold"
 tfast_sc_chosen_power_3_modifier_desc:0 "The prophecy burns bright. Hollow immortals take note, and take flight."
 tfast_sc_stronghold_modifier:0 "Hollow Stronghold"
 tfast_sc_stronghold_modifier_desc:0 "This county is a Hollow refuge: warded, deep, and older than its church."
 tfast_sc_wall_towers_modifier:0 "Great Wall: Watchtowers"
 tfast_sc_wall_towers_modifier_desc:0 "Watchtowers stand along the frontier, lit through every false-peace night."
 tfast_sc_wall_rampart_modifier:0 "Great Wall: Rampart"
 tfast_sc_wall_rampart_modifier_desc:0 "A rampart of fitted stone, raised by hands that have seen what the Host does."
 tfast_sc_wall_gate_modifier:0 "Great Wall: Gates"
 tfast_sc_wall_gate_modifier_desc:0 "The gates are shut and barred. The Hollow's raiders break on them or turn aside."
 tfast_sc_wall_wards_modifier:0 "Great Wall: Wards"
 tfast_sc_wall_wards_modifier_desc:0 "Old signs are cut into the stones. The Hollow's hands cannot cross them unbroken."
 tfast_sc_raided_modifier:0 "Stripped by the Hollow"
 tfast_sc_raided_modifier_desc:0 "The Host came, took, and left the rest smoldering. The survivors remember the silence of their wards."
 tfast_sc_frost_county_modifier:0 "Kaedryn's Frost"
 tfast_sc_frost_county_modifier_desc:0 "Where Kaedryn's blood walked, the rivers froze in their beds and the fields forgot the sun."
 tfast_sc_rebuilding_modifier:0 "Rebuilding"
 tfast_sc_rebuilding_modifier_desc:0 "Hands that were idle after the raiders came are now busy. The county is being made whole."
 tfast_sc_tale_modifier:0 "A Tale Well Told"
 tfast_sc_tale_modifier_desc:0 "The dynasty's deeds are being told aloud again - and the listeners believe every word."

##############################################################
# MEN-AT-ARMS
##############################################################
 tfast_sc_legionnaires:0 "Hollow Legionnaires"
 tfast_sc_legionnaires_flavor:0 "The line does not breathe, and does not give ground."
 tfast_sc_gravebound_knights:0 "Gravebound Knights"
 tfast_sc_gravebound_knights_flavor:0 "They were buried with their horses. Nobody asked the horses."
 tfast_sc_frost_wraiths:0 "Frost Wraiths"
 tfast_sc_frost_wraiths_flavor:0 "Riders of the cold wind, who run down what flees and leave what stands."
 tfast_sc_siegeguard:0 "Siegeguard"
 tfast_sc_siegeguard_flavor:0 "They carry the wall-breakers, and they do not stop for walls."
 tfast_sc_reanimated_hordes:0 "Reanimated Hordes"
 tfast_sc_reanimated_hordes_flavor:0 "The risen dead march by weight of numbers. Their officers carry shovels."
 tfast_sc_elite_guard:0 "The Overlord's Own"
 tfast_sc_elite_guard_flavor:0 "One regiment, ever. It has never been replaced, only reissued."

##############################################################
# CASUS BELLI
##############################################################
 tfast_sc_reckoning_war:0 "The Great Reckoning"
 tfast_sc_reckoning_war_victory_desc:0 "The Hollow takes a county of the wargoal and strips the border."
 tfast_sc_reckoning_war_victory_desc_defender:0 "The Hollow takes one of your counties, and the border burns behind it."
 tfast_sc_reckoning_war_white_peace_desc:0 "The Reckoning withdraws. No ground changes hands."
 tfast_sc_reckoning_war_white_peace_desc_defender:0 "The Reckoning withdraws. You keep your lands, and what remains of them."
 tfast_sc_reckoning_war_defeat_desc:0 "The Reckoning is broken and falls back into the hollow places."
 tfast_sc_reckoning_war_defeat_desc_defender:0 "You have broken the Reckoning. The Host falls back to its refuges."
 tfast_sc_reckoning_war_invalidated_desc:0 "The Reckoning dissolves as the wargoal slips away."

 tfast_sc_rebellion_war:0 "The Schism War"
 tfast_sc_rebellion_war_victory_desc:0 "The rebel breaks away from the Hollow Dominion."
 tfast_sc_rebellion_war_white_peace_desc:0 "The rebellion falters without resolution."
 tfast_sc_rebellion_war_defeat_desc:0 "The rebellion is crushed and the Dominion closes its grip."
 tfast_sc_rebellion_war_invalidated_desc:0 "The rebellion dissolves into nothing."

##############################################################
# DECISIONS
##############################################################
 tfast_sc_raise_the_hollow:0 "Raise the Hollow Dominion"
 tfast_sc_raise_the_hollow_desc:0 "The Hollow have always been down there. If, for any reason, this campaign has not yet met them, this is the moment: the Dominion is raised, the Overlord takes his islands, and the Ten come to their father's side. This can only ever be done once."
 tfast_sc_raise_the_hollow_tt:0 "The Hollow Dominion is raised: the Overlord, the Ten, and the strongholds."

 tfast_sc_wall_plan:0 "Plan the Great Wall"
 tfast_sc_wall_plan_desc:0 "The Host comes by land and by sea, but it comes along the roads. Draw the line on the map: your capital and your other counties in this duchy, up to four. The planning costs nothing; the stones cost everything."
 tfast_sc_wall_plan_tt:0 "A Great Wall project begins: your capital county and up to three of your other counties in this duchy are designated."

 tfast_sc_wall_build_towers:0 "Great Wall: Raise Watchtowers"
 tfast_sc_wall_build_towers_desc:0 "Timber and signal fires along the frontier. Every false-peace night, someone is watching."
 tfast_sc_wall_towers_tt:0 "Watchtowers rise on every designated wall county."

 tfast_sc_wall_build_rampart:0 "Great Wall: Raise the Rampart"
 tfast_sc_wall_build_rampart_desc:0 "Fitted stone, dug deep. It will not stop an army. It will make the army pay."
 tfast_sc_wall_rampart_tt:0 "The rampart rises on every designated wall county."

 tfast_sc_wall_build_gates:0 "Great Wall: Close the Gates"
 tfast_sc_wall_build_gates_desc:0 "The gates go up last, and they go up shut. While they stand unbreached, the Hollow's raiders cannot take your stores - they can only break themselves on the stone."
 tfast_sc_wall_gates_tt:0 "The gates close. Scripted Hollow raids against your walled capital are blocked until a breach."

 tfast_sc_wall_build_wards:0 "Great Wall: Set the Wards"
 tfast_sc_wall_build_wards_desc:0 "The old signs, cut into new stone. The Hollow's hands cannot cross them unbroken."
 tfast_sc_wall_wards_tt:0 "Wards are set into the Great Wall; its defense against the Host improves."

 tfast_sc_wall_fund:0 "Fund the Great Wall"
 tfast_sc_wall_fund_desc:0 "Garrisons eat, masons are paid, and the watch is kept. Ten more years of upkeep, or the stones begin to weather."
 tfast_sc_wall_fund_tt:0 "Adds ten years of wall upkeep."

 tfast_sc_wall_repair:0 "Repair the Great Wall"
 tfast_sc_wall_repair_desc:0 "What the Host broke, masons can mend - if the treasury pays before the next raid season."
 tfast_sc_wall_repair_tt:0 "Restores wall integrity and rehangs a breached gate."

 tfast_sc_last_watch_recruit:0 "Recruit a Watch Commander"
 tfast_sc_last_watch_recruit_desc:0 "Someone must command the wall's garrison: to count the sounds on the far side and to decide, at the third bell, whether to send for help."
 tfast_sc_last_watch_tt:0 "A watch commander joins your court with the Watchman of the Great Wall trait."

 tfast_sc_rebuild_county:0 "Rebuild the Capital"
 tfast_sc_rebuild_county_desc:0 "The raiders are gone and the counting is done. Put the survivors to work before they decide to leave."
 tfast_sc_rebuild_county_tt:0 "Removes the Stripped by the Hollow modifier from your capital and begins rebuilding."

 tfast_sc_tell_the_tale:0 "Tell the Tale"
 tfast_sc_tell_the_tale_desc:0 "What your dynasty survived - the raid thrown back, the wall held, the immortal unmade - becomes something better than history when it is told aloud."
 tfast_sc_tell_the_tale_tt:0 "Your recorded memories become renown: prestige, and a temporary boon to your name."

 tfast_sc_chosen_deepen_power:0 "Deepen the Power"
 tfast_sc_chosen_deepen_power_desc:0 "The Awakened can sit with what woke in them. Every threshold crossed is a Hollow immortal's nightmare given one more tooth."
 tfast_sc_power_2_tt:0 "The Awakened power deepens to the Second Threshold."
 tfast_sc_power_3_tt:0 "The Awakened power deepens to the Burning Threshold."

 tfast_sc_invoke_true_death:0 "Invoke True Death"
 tfast_sc_invoke_true_death_desc:0 "There is a way to make a Hollow immortal stop. It requires the war to still be burning, the Awakened to still be standing, and the kind of nerve that ends dynasties either way."
 tfast_sc_true_death_success_tt:0 "True Death: the immortal is permanently destroyed."
 tfast_sc_true_death_failure_tt:0 "True Death fails: you are thrown back, bleeding and shaken."

 tfast_sc_world_council_pledge:0 "Pledge to the World Council"
 tfast_sc_world_council_pledge_desc:0 "Rulers who have heard the same warnings should not face the Reckoning alone. Swear the pledge, and let the Hollow count the world's spears instead of one realm's."
 tfast_sc_world_council_tt:0 "You join the World Council: your realm is strengthened against the Hollow and your name carries the pledge."

 tfast_sc_raise_the_hollow_tooltip:0 "The Hollow Dominion is raised: the Overlord, the Ten, and the strongholds."
 tfast_sc_raise_the_hollow_confirm:0 "Raise the Dominion"
 tfast_sc_wall_plan_tooltip:0 "A Great Wall project begins: your capital county and up to three of your other counties in this duchy are designated."
