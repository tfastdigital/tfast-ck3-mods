 tfast_sc_long_night_tfast_sc_cold_long_night_situation_phase:0 "$tfast_sc_cold_long_night$"
 tfast_sc_cold_thaw_effects:0 "A Remembered Cold"
 tfast_sc_cold_winter_effects:0 "Winter on the North"
 tfast_sc_cold_long_night_effects:0 "Night That Stays"

 tfast_sc_hollow_legacy_track:0 "Shattered Crowns"
 tfast_sc_hollow_legacy_track_desc:0 "The blood that was born before people. Cold, closed, and still ruling."
 tfast_sc_legacy_1:0 "Cold Blood"
 tfast_sc_legacy_1_desc:0 "Prowess and dread. The living step aside."
 tfast_sc_legacy_2:0 "Winter Host"
 tfast_sc_legacy_2_desc:0 "Knights hit harder, levies stand thicker, and the host costs less."
 tfast_sc_legacy_3:0 "Closed Line"
 tfast_sc_legacy_3_desc:0 "Prestige from a bloodline that does not marry outside itself."
 tfast_sc_legacy_4:0 "Permanent Seats"
 tfast_sc_legacy_4_desc:0 "The castles pay, and the counties grow."
 tfast_sc_legacy_5:0 "The Scythe"
 tfast_sc_legacy_5_desc:0 "Armies cut deeper, and schemes against the dynasty fail more often."

