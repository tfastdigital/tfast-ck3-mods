 tfast_sc_tell_the_tale_confirm:0 "Tell it"
 tfast_sc_chosen_deepen_power_tooltip:0 "The Awakened power deepens by one threshold."
 tfast_sc_chosen_deepen_power_confirm:0 "Cross the threshold"
 tfast_sc_invoke_true_death_tooltip:0 "Attempt True Death against a Hollow immortal while the war still burns."
