# THE HOLLOW TIDE -- SITUATIONS WINDOW
##############################################################
 situation_tfast_sc_hollow_tide:0 "The Hollow Tide"
 situation_tfast_sc_hollow_tide_desc:0 "The Hollow Dominion woke with the world and has never gone back to sleep. This is the tide of the war between the living and the Host: from predatory peace, through escalation and the Great Reckoning, into aftermath or the Long Dark - and, when the world finds its courage, into the uprising that breaks it."
 tfast_sc_hollow_tide_sub_region_core:0 "The Suffering World"
 tfast_sc_hollow_tide_sub_region_core_desc:0 "Every roof, every field, every road the Host has ever ridden down."

 tfast_sc_hollow_tide_participant_group_the_roofed_world:0 "The Roofed World"
 tfast_sc_hollow_tide_participant_group_the_roofed_world_desc:0 "Every landed ruler who is not of the Hollow: the people the tide comes for."
 tfast_sc_hollow_tide_participant_group_the_hollow:0 "The Hollow Dominion"
 tfast_sc_hollow_tide_participant_group_the_hollow_desc:0 "The Supreme Immortal Overlord and his ten original children, and whatever wears their colors."

 tfast_sc_tide_peace:0 "Predatory Peace"
 tfast_sc_tide_peace_icon:0 "$tfast_sc_tide_peace$"
 tfast_sc_tide_peace_desc:0 "The Host ranges where it likes, and the world has learned the habit of leaving lights burning. Nothing is at war. That is the problem."
 tfast_sc_hollow_tide_tfast_sc_tide_peace_situation_phase:0 "$tfast_sc_tide_peace$"

 tfast_sc_tide_escalation:0 "Escalation"
 tfast_sc_tide_escalation_icon:0 "$tfast_sc_tide_escalation$"
 tfast_sc_tide_escalation_desc:0 "The raids come faster, the strongholds draw closer, and the world's warnings start arriving two years before the thing they warn about."
 tfast_sc_hollow_tide_tfast_sc_tide_escalation_situation_phase:0 "$tfast_sc_tide_escalation$"

 tfast_sc_tide_reckoning:0 "The Great Reckoning"
 tfast_sc_tide_reckoning_icon:0 "$tfast_sc_tide_reckoning$"
 tfast_sc_tide_reckoning_desc:0 "The Host has come in force. The war on the map now decides everything that follows."
 tfast_sc_hollow_tide_tfast_sc_tide_reckoning_situation_phase:0 "$tfast_sc_tide_reckoning$"

 tfast_sc_tide_aftermath:0 "Aftermath"
 tfast_sc_tide_aftermath_icon:0 "$tfast_sc_tide_aftermath$"
 tfast_sc_tide_aftermath_desc:0 "The Host has withdrawn - hurt, not finished. The world counts its dead, rebuilds its walls, and waits for the tide to remember it."
 tfast_sc_hollow_tide_tfast_sc_tide_aftermath_situation_phase:0 "$tfast_sc_tide_aftermath$"

 tfast_sc_tide_dark:0 "The Long Dark"
 tfast_sc_tide_dark_icon:0 "$tfast_sc_tide_dark$"
 tfast_sc_tide_dark_desc:0 "The Reckoning was lost. Plague and tithe and silence now rule more of the world than any crown does - until someone decides not to endure it."
 tfast_sc_hollow_tide_tfast_sc_tide_dark_situation_phase:0 "$tfast_sc_tide_dark$"

 tfast_sc_tide_uprising:0 "The Uprising"
 tfast_sc_tide_uprising_icon:0 "$tfast_sc_tide_uprising$"
 tfast_sc_tide_uprising_desc:0 "Bells in the wrong key, banners raised by people who were told to stay inside. The world has decided to rise, and the Host is discovered to be finite."
 tfast_sc_hollow_tide_tfast_sc_tide_uprising_situation_phase:0 "$tfast_sc_tide_uprising$"

 tfast_sc_merc_carrion:0 "The Carrion Company"
 tfast_sc_merc_unburied:0 "The Unburied Host"
 tfast_sc_merc_pale:0 "The Pale Reckoning"

 tfast_sc_tide_peace_effects:0 "A Watched Peace"
 tfast_sc_tide_escalation_effects:0 "The Raids Quicken"
 tfast_sc_tide_reckoning_effects:0 "The Host is in the Field"
 tfast_sc_tide_aftermath_effects:0 "Counting the Dead"
 tfast_sc_tide_dark_effects:0 "The Long Dark"
 tfast_sc_tide_uprising_effects:0 "The World Rises"

 tfast_sc_open_the_tide:0 "The Hollow Tide"
 tfast_sc_open_the_tide_desc:0 "Put the war with the Hollow into the Situations window, beside the Christian Church and the other great situations. Predatory Peace is the opening chapter."
 tfast_sc_open_the_tide_confirm:0 "Open the tide"
 tfast_sc_open_the_tide_tooltip:0 "$tfast_sc_open_the_tide_desc$"
 tfast_sc_open_the_tide_tt:0 "The Hollow Tide appears under Your Situations."

 tfast_sc_wall_founder_modifier:0 "Warden of the Winter Wall"
 tfast_sc_wall_founder_modifier_desc:0 "This ruler raised a wall the Hollow have to break before they can feed."

 great_project_type_tfast_sc_great_wall:0 "The Winter Wall"
 great_project_type_tfast_sc_great_wall_desc:0 "A wall across your capital and the counties of its duchy. Vassals, your liege and your allies can fund it. When the gates close, scripted Hollow raids break on the stone instead of your treasury."
 tfast_sc_great_wall_at_capital_tt:0 "The wall is raised at your [capital|E]."
 great_project_type_tfast_sc_great_wall_contribution_stone:0 "Quarry the Stone"
 great_project_type_tfast_sc_great_wall_contribution_stone_desc:0 "The facing of the wall. Without stone the rest is a fence."
 great_project_type_tfast_sc_great_wall_contribution_timber:0 "Fell the Timber"
 great_project_type_tfast_sc_great_wall_contribution_timber_desc:0 "Scaffolding, gates and the towers' bones."
 great_project_type_tfast_sc_great_wall_contribution_labor:0 "Call the Labor"
 great_project_type_tfast_sc_great_wall_contribution_labor_desc:0 "Years of work, paid in standing rather than coin."
 great_project_type_tfast_sc_great_wall_contribution_wards:0 "Set the Wards"
 great_project_type_tfast_sc_great_wall_contribution_wards_desc:0 "Optional. Faith worked into the stone, so the Hollow's tricks fail at the gate."

 tfast_sc_dark_commander_modifier:0 "Commander of the First Dark"
 tfast_sc_dark_commander_modifier_desc:0 "Vaelith holds her own seat and leads armies. The dark remembers her voice."
 tfast_sc_dark_host:0 "Host of the First Dark"

 tfast_sc.1100.t:0 "Born Before People"
 tfast_sc.1100.desc:0 "Vaelos and Vaelith were born on the same day, brother and sister, out of the dark. There were no people yet. No hearth, no name for the sky. They remember the dark the way others remember a mother, and they have started to look for the place it was."
 tfast_sc.1100.a:0 "The search begins."

 tfast_sc.1101.t:0 "The Same Night"
 tfast_sc.1101.desc:0 "Vaelith remembers it too. Not a story he told her. The same cold, the same silence, the moment before anything living had a face. She is his twin, his wife, and the one who will take an army toward whatever is left of that night."
 tfast_sc.1101.a:0 "Then we look together."

 tfast_sc.1102.t:0 "She Takes the Host"
 tfast_sc.1102.desc:0 "Vaelith raises the Host of the First Dark from her seat in the west. She will command it herself. They are not looking for a kingdom. They are looking for the shore where they were born, if any shore is old enough."
 tfast_sc.1102.a:0 "Let her lead."

 tfast_sc.1103.t:0 "A Shore With No Bones"
 tfast_sc.1103.desc:0 "The host finds a black shore. No graves. No tools. No sign that people were ever there. The dark is older than the search, and it does not answer. Vaelos and Vaelith stand in it and know this is only the edge."
 tfast_sc.1103.a:0 "Keep looking."
 tfast_sc.1103.b:0 "Hold the seats. Leave a watch on that shore."

 tfast_sc.1104.t:0 "Still Looking"
 tfast_sc.1104.desc:0 "Another year, and the twins are still searching. Each memory is the same: they woke in the dark, already ancient, already two. The world of people came later. They have not found the beginning. They will not stop."
 tfast_sc.1104.a:0 "The dark can wait. We cannot."

 tfast_sc.1200.t:0 "The Scythe"
 tfast_sc.1200.desc:0 "A hundred years have gone. The Hollow take room among other rulers. The Ten are not touched. Only the children they themselves give birth to are taken, and only to open a place for another birth. A few other rulers, by luck, are still breathing when it is over."
 tfast_sc.1200.a:0 "Count the living."

 tfast_sc_hollow_culture:0 "First Cold"
 heritage_tfast_sc_elder:0 "Elder"
 language_tfast_sc_cold:0 "Cold Speech"
 heritage_tfast_sc_elder_collective_noun:0 "the First Cold"

 trait_tfast_sc_white_walker:0 "White Walker"
 trait_tfast_sc_white_walker_desc:0 "Born of the dark before people. The living fear them. They do not fear each other."
 trait_tfast_sc_white_walker_character_desc:0 "The cold is in [CHARACTER.GetHerHis] blood. The living keep their distance. [CHARACTER.GetHerHis] own do not."
 trait_tfast_sc_hollow_unwed:0 "Takes No Wife"
 trait_tfast_sc_hollow_unwed_desc:0 "The Ten do not marry. There is no wife, and no husband."
 trait_tfast_sc_hollow_unwed_character_desc:0 "[CHARACTER.GetFirstNameNoTooltip] takes no wife. The line does not marry."
 trait_tfast_sc_hollow_two_born:0 "Two and No More"
 trait_tfast_sc_hollow_two_born_desc:0 "Two living children already. Another birth waits on a death."
 trait_tfast_sc_hollow_two_born_character_desc:0 "Two children of [CHARACTER.GetFirstNameNoTooltip] still live. Room for another comes only when one of them is gone."

 tfast_sc_wights:0 "Wights"
 tfast_sc_wights_flavor:0 "The dead of the last field, still walking because a white walker told them to."
 tfast_sc_wight_army:0 "Raised Dead"

 situation_tfast_sc_long_night:0 "The Long Night"
 situation_tfast_sc_long_night_desc:0 "A cold that belongs to the north of this map. It thaws, it returns, and sometimes it stays. The Hollow walk in it. This is not another world's Wall."
 tfast_sc_long_night_participant_group_the_north:0 "The North"
 tfast_sc_long_night_participant_group_the_cold:0 "The Cold"
 tfast_sc_cold_thaw:0 "The Thaw"
 tfast_sc_cold_thaw_desc:0 "The north can be farmed. The cold is only a memory, and memories come back."
 tfast_sc_cold_winter:0 "The Winter"
 tfast_sc_cold_winter_desc:0 "Supplies run thin. The white walkers are stronger in this cold than the people who live here."
 tfast_sc_cold_long_night:0 "The Long Night"
 tfast_sc_cold_long_night_desc:0 "The dark does not lift. Levies fail. The Cold does not."
 tfast_sc_long_night_tfast_sc_cold_thaw_situation_phase:0 "$tfast_sc_cold_thaw$"
