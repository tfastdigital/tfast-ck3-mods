##############################################################
# THE LONG DARK -- EVENTS
##############################################################
 tfast_sc.0900.t:0 "The Hollow Tithe"
 tfast_sc.0900.desc:0 "A rider in grey brings the ledger: the Hollow have counted your harvest, your herd, and your patience, and they have decided what is theirs. The figure is not negotiable. The rider waits to see what you are."
 tfast_sc.0900.a:0 "Pay what they ask."
 tfast_sc.0900.b:0 "Refuse them."

 tfast_sc.0901.t:0 "The Fever Year"
 tfast_sc.0901.desc:0 "It starts with a cough in the lower town and ends, by the look of the lazaret tents, somewhere much worse. The physicians disagree with each other in loud voices, which is how you know it is serious."
 tfast_sc.0901.a:0 "Tend the sick yourself."
 tfast_sc.0901.b:0 "Seal the gates."
 tfast_sc.0901.c:0 "Let it burn through."

 tfast_sc.0902.t:0 "The Roads Are Cut"
 tfast_sc.0902.desc:0 "The blockade is quiet: no columns of smoke, no siege lines - just carts that never arrive, prices that climb by themselves, and letters that stop mid-sentence. The wall is fine. The world is not getting in."
 tfast_sc.0902.a:0 "Pay for armed escorts."
 tfast_sc.0902.b:0 "Endure."

 tfast_sc.0903.t:0 "The Hollow At The Wall"
 tfast_sc.0903.desc:0 "The Host came in the dark and put its shoulders to your stones. Towers that took a year to raise are rubble in a night, and the wall itself stands shaken, fractionally less than it was. The masons will have work."
 tfast_sc.0903.a:0 "Survey the damage."

 tfast_sc.0904.t:0 "THE LONG DARK"
 tfast_sc.0904.desc:0 "The Reckoning is over, and it did not end the way the stories promised. The Hollow are not marching. They are settling - into the ledger offices, the toll roads, the granaries. The world has been won, and it is learning what that means."
 tfast_sc.0904.a:0 "Endure. Watch. Wait."

 tfast_sc.0905.t:0 "The World Rises"
 tfast_sc.0905.desc:0 "It begins with a bell rung in the wrong key, and then another, and then every tower in the county is answering. Somewhere the Hollow will blame the weather. They are about to have a much worse year than the weather."
 tfast_sc.0905.a:0 "Stand with the risen."

 tfast_sc.0906.t:0 "The Dawnbreak"
 tfast_sc.0906.desc:0 "The Host is gone before anyone can say they drove it - back through the doors it made, into the ground it came from, smaller than it arrived. The dark lifts the way a held breath ends. Somewhere a scribe, very carefully, writes down every name."
 tfast_sc.0906.a:0 "Write mine first."

 tfast_sc.0907.t:0 "A Stronghold Has Fallen"
 tfast_sc.0907.desc:0 "One of the three seats the Hollow kept in the living world has changed hands. The stones are just stones now; the deep places under them are someone else's problem. It is a small thing, and the world is short of small things."
 tfast_sc.0907.a:0 "One seat less."

 tfast_sc.0908.t:0 "The Wall Is Unmade"
 tfast_sc.0908.desc:0 "The Great Wall is down - not breached, not abandoned, but unmade: counties stripped of their wards, gates open where no gates stand, a project that outlived its masons and did not outlive the dark. Grass will grow over it. Someone will build there anyway."
 tfast_sc.0908.a:0 "Stone remembers nothing."

##############################################################
# THE LONG DARK -- MODIFIERS
##############################################################
 tfast_sc_dark_plague_modifier:0 "Plague in the Long Dark"
 tfast_sc_dark_plague_modifier_desc:0 "The dark years brought fever with them; the sick-carts run all night and the harvest is left standing."
 tfast_sc_dark_famine_modifier:0 "Hunger in the Long Dark"
 tfast_sc_dark_famine_modifier_desc:0 "Nothing reaches the market that did not grow within sight of it. The stores are counted twice and run out once."
 tfast_sc_dark_poverty_modifier:0 "Poverty in the Long Dark"
 tfast_sc_dark_poverty_modifier_desc:0 "Coin has gone to the tithe and the toll. What is left is spent slowly, on little, by fewer people."
 tfast_sc_wall_blockade_modifier:0 "Blockaded Wall County"
 tfast_sc_wall_blockade_modifier_desc:0 "The routes through the gate are cut. The wall holds out the Host and, unavoidably, everyone else."
 tfast_sc_wall_reinforced_modifier:0 "Great Wall: Reinforced"
 tfast_sc_wall_reinforced_modifier_desc:0 "The wall has been refaced and thickened; the gates weigh what gates should."
 tfast_sc_wall_reinforced_2_modifier:0 "Great Wall: Doubly Reinforced"
 tfast_sc_wall_reinforced_2_modifier_desc:0 "Two refits deep, the wall is the hardest thing standing in this part of the world."
 tfast_sc_dark_malady_modifier:0 "Hollow Malady"
 tfast_sc_dark_malady_modifier_desc:0 "The air of the dark years sits in the chest and does not leave politely."
 tfast_sc_uprising_spirit_modifier:0 "The Spirit of the Uprising"
 tfast_sc_uprising_spirit_modifier_desc:0 "You stood while the world was dark, and the world has decided it remembers."

##############################################################
# HIDING FROM THE HOST
##############################################################
 tfast_sc_go_into_hiding:0 "Go Into Hiding"
 tfast_sc_go_into_hiding_desc:0 "The Host's ledger has your name in it, and ledgers can be survived. Withdraw from the roads, the feasts, and the record - let rumor do the ruling for a while."
 tfast_sc_go_into_hiding_tooltip:0 "For #P 5 years#! the Hollow's raids pass you by, unless the Host makes hunting you its goal. Costs #P 150#! prestige, and the court will talk."
 tfast_sc_go_into_hiding_confirm:0 "Withdraw from sight"
 tfast_sc_go_into_hiding_tt:0 "You go into hiding from the Host."

 tfast_sc_come_out_of_hiding:0 "Come Out of Hiding"
 tfast_sc_come_out_of_hiding_desc:0 "The roads have grown safer, or your patience has grown shorter - which in this world are the same thing."
 tfast_sc_come_out_of_hiding_tooltip:0 "Step back into the light and stop paying the court's gossip-price."
 tfast_sc_come_out_of_hiding_confirm:0 "Step back into the light"
 tfast_sc_come_out_of_hiding_tt:0 "You come out of hiding."

 tfast_sc_hiding_modifier:0 "In Hiding"
 tfast_sc_hiding_modifier_desc:0 "The ruler is withdrawn from the roads and the record; the court whispers and the coin thins."

##############################################################
# THE HOST'S APPETITES -- EVENTS
##############################################################
 tfast_sc.0910.t:0 "The Host Has Fed"
 tfast_sc.0910.desc:0 "The grain carts stopped arriving from the north, and then the people stopped. When the Host eats, it eats the years: orchards, children, the slow work of a generation. The Hollow have fed."
 tfast_sc.0910.a:0 "Count what is left."

 tfast_sc.0911.t:0 "An Example Is Made"
 tfast_sc.0911.desc:0 "Where the Host passes, the wall keeps standing and everything behind it stops: no tolls, no courts, no harvest. It is not war. It is a lesson, written where everyone can see it."
 tfast_sc.0911.a:0 "Let the world see."

 tfast_sc.0912.t:0 "They Have Your Scent"
 tfast_sc.0912.desc:0 "For a while the Host looked past your gates, and you were safe the way a mouse is safe - until the shadows stopped being empty. They know where you are. Hiding bought time. It never bought safety."
 tfast_sc.0912.a:0 "Run - or don't."

