##############################################################
# EVENTS -- RAID
##############################################################
 tfast_sc.0100.t:0 "The Host Comes for Your Stores"
 tfast_sc.0100.desc:0 "The watch fires along your border burn low and then die. Riders out of the hollow places have been seen on the roads, moving with the patience of people who have all the time in the world. They are not here to conquer you. Yet.\n\nWhat comes will strip what it can carry and spoil what it cannot."
 tfast_sc.0100.a:0 "Ride out with the marshal."
 tfast_sc.0100.b:0 "To the walls, then. Let them come."

##############################################################
# EVENTS -- RECKONING
##############################################################
 tfast_sc.0200.t:0 "The Reckoning Foretold"
 tfast_sc.0200.desc:0 "It begins in the small things: a Hollow host seen drilling in the dead of winter, unbothered by the cold; messengers in the colors of no living house paying in gold that is cold to the touch; old soldiers waking at the same hour of the night, all across the world, certain that someone has called their name.\n\nThe Hollow Dominion has stopped counting its dead. It is counting the world's walls."
 tfast_sc.0200.a:0 "Then we will count our spears."

 tfast_sc.0201.t:0 "THE GREAT RECKONING BEGINS"
 tfast_sc.0201.desc:0 "The warnings were real. The Host is on the roads, and the roads lead here. Banners that have not been seen in a thousand years hang above columns of soldiers who do not tire, do not stop, and do not answer when spoken to.\n\nThe Reckoning has begun. It will not end until the world decides how it ends."
 tfast_sc.0201.a:0 "Sound the horns."

 tfast_sc.0202.t:0 "The Reckoning Ends"
 tfast_sc.0202.desc:0 "The tide has turned - by armies, by walls, or by the simple arithmetic of the Host's losses. The Hollow fall back to their refuges, and the world takes its first breath in years. But the roads out of this are choked with the people who were in the way. They have nowhere to go, and everything they had is behind them."
 tfast_sc.0202.a:0 "Open the gates. There is room enough for a while."
 tfast_sc.0202.b:0 "The gates stay shut. The realm comes first."

 tfast_sc.0203.t:0 "The Hollow Stir Again"
 tfast_sc.0203.desc:0 "For years there has been nothing from the hollow places but silence. Now there are campfires in the ruins where there should be none, and the toll roads report payments in gold that was voided a generation ago. Whatever was sealed down there is awake, and it remembers everything."
 tfast_sc.0203.a:0 "Let the wardens know."

##############################################################
# EVENTS -- WALL
##############################################################
 tfast_sc.0301.t:0 "The Watch Reports"
 tfast_sc.0301.desc:0 "The Host tested the wall in the mist before dawn. The watch held the towers, the gates held the pressure, and the dead fell back into the dark to try again another night. The wall did its work. Someone should pay the watch, and mend what they can."
 tfast_sc.0301.a:0 "Pay the watch."

 tfast_sc.0302.t:0 "A Great Wall Gate Has Been Breached"
 tfast_sc.0302.desc:0 "Word reaches every court that matters: the Host has broken open a gate in a Great Wall. What took years and a treasury to raise, the dead unmade in a single night. The world's spine has a hole in it now, and the Hollow know exactly where it is."
 tfast_sc.0302.a:0 "They will not stop at one wall."

 tfast_sc.0303.t:0 "The Wall Stands Unfunded"
 tfast_sc.0303.desc:0 "The garrison is unpaid, the masons have gone home, and the watch is being kept by whoever is frightened enough. Stone does not care about fear. Stone weathers."
 tfast_sc.0303.a:0 "Find the coin. Find it somewhere."

##############################################################
# EVENTS -- PROPHECY
##############################################################
 tfast_sc.0402.t:0 "A Quiet Omen"
 tfast_sc.0402.desc:0 "The midwife says nothing at first, and then says only that the child was born in the hour when the candles guttered, and that the guttering was the wrong way for the wind. An old servant crosses themselves and goes back to work. Nothing more happens. Nothing at all.\n\nFor now."
 tfast_sc.0402.a:0 "Note it in the chronicle and move on."

 tfast_sc.0403.t:0 "THE AWAKENING"
 tfast_sc.0403.desc:0 "It is not a dream and it is not a fever. It is the sensation of every ancestor the dynasty has ever buried stepping back - politely, deliberately - to make room.\n\nThe Awakened knows now what the Hollow are, why they wait, and what the only weapon in the world that matters is. The prophecy has opened its eyes, and it is looking directly at the Hollow Court."
 tfast_sc.0403.a:0 "I know what I have to do."

 tfast_sc.0404.t:0 "The Prophecy Ends"
 tfast_sc.0404.desc:0 "The bloodline the prophecy was waiting on has run out - no children, no grandchildren, no one at all. Whatever the Chosen would have been, the world will not meet them now. The Hollow, if they ever learn of it, will be relieved. That is the best that can be said."
 tfast_sc.0404.a:0 "So it ends."

##############################################################
# EVENTS -- IMMORTAL
##############################################################
 tfast_sc.0500.t:0 "The Confrontation"
 tfast_sc.0500.desc:0 "They are close enough to see now, and that is the terrible thing: they look almost like people. Almost. The Awakened can feel the difference the way the sea feels a wrong tide.\n\nThere is a strike that ends them - a permanent one. It has a price every time it fails, and the Hollow behind this one will remember the attempt forever. But it is here. Now."
 tfast_sc.0500.a:0 "Strike."
 tfast_sc.0500.b:0 "Not yet."

 tfast_sc.0501.t:0 "An Immortal Has Been Destroyed"
 tfast_sc.0501.desc:0 "A Hollow immortal has died - not banished, not buried, but ended: a name struck out of the ledger, in a book where names were supposed to be permanent. Somewhere deep in the ground, something that has been patient for a very long time has stopped being patient."
 tfast_sc.0501.a:0 "The world is a little safer tonight."

 tfast_sc.0502.t:0 "The Overlord Is Sealed"
 tfast_sc.0502.desc:0 "They could not kill him - the Overlord of the Hollow cannot be killed, only bound, spoiled of his wars and his gaze. His children are left to rule a realm without its head, and the Court of the Ten has begun, quietly and immediately, to count the knives."
 tfast_sc.0502.a:0 "A lock, then. Not a tomb."

 tfast_sc.0503.t:0 "The Seal Is Broken"
 tfast_sc.0503.desc:0 "The wards failed at the same hour in every place they were set, and the silence that followed was worse than any sound. The Overlord of the Hollow walks again. He did not spend the interval sleeping. He spent it counting."
 tfast_sc.0503.a:0 "Set the watch. All of it."

##############################################################
# EVENTS -- CRISIS DIPLOMACY
##############################################################
 tfast_sc.0600.t:0 "A Hollow Immortal in Your Dungeons"
 tfast_sc.0600.desc:0 "The prisoner does not eat, does not sleep, and answers questions in a calm voice with the patient wait of someone who has outlived every jailer they have ever met. The Hollow Court has not sent a demand. That silence is more frightening than any demand would have been."
 tfast_sc.0600.a:0 "Release them with an escort and a message."
 tfast_sc.0600.b:0 "Execute them. Let the world see."
 tfast_sc.0600.c:0 "Seal the Overlord away where no one will find him."
 tfast_sc.0600.d:0 "Keep them. He is worth more in the dungeon."

##############################################################
# EVENTS -- MEMORY
##############################################################
 tfast_sc.0700.t:0 "The Tale Is Told"
 tfast_sc.0700.desc.true_death:0 "When the tale reaches the part where the immortal stops - stops being, stops returning, stops being a story anyone will have to tell again - the hall goes quiet enough to hear the candles. Your house is the house that ended something eternal. That will be told for as long as there are ears for it."
 tfast_sc.0700.desc.wall:0 "The listeners know the wall. Everyone does now. What they did not know was the weight of the third night, when the mist came up and the watch counted the breathing on the far side and decided to stay. Your people tell it well. Your house is the house that stayed."
 tfast_sc.0700.desc.raid:0 "The raiders came for the stores and went home with less than they came with. The tale loses nothing in the telling: the gates, the arrows, the way the Host's silence broke at exactly the moment the levy formed up. Your name is attached to that silence."
 tfast_sc.0700.desc.generic:0 "The scribes set down what happened, and the scribes are careful, because your house reads what they write. Not every deed is a legend. Every legend started this way."
 tfast_sc.0700.a:0 "Good. Let it be told."

##############################################################
# EVENTS -- HOLLOW COURT
##############################################################
 tfast_sc.0810.t:0 "The Hollow Court Is Torn"
 tfast_sc.0810.desc:0 "One of the Ten has raised their own host against the Overlord. The Court of the Ten is at war with itself - the dead spilling their own cold blood over a throne none of them can sit on for more than a lifetime. It will not last. Nothing does, down there."
 tfast_sc.0810.a:0 "Even eternities have bad years."

 tfast_sc.0811.t:0 "A Banished One Walks Again"
 tfast_sc.0811.desc:0 "The guard reports a face that was seen once and burned into memory: one of the Ten, the ones who are supposed to be gone. They are walking the roads again under the Hollow colors, wearing the years like a coat they never took off."
 tfast_sc.0811.a:0 "They do not stay dead."

##############################################################
# GAME RULES -- GOLD DEPOSITS
##############################################################
 rule_tfast_sc_economy:0 "Shattered Crowns: Hidden Gold"
 setting_tfast_sc_economy_on:0 "On"
 setting_tfast_sc_economy_on_desc:0 "Six historical gold counties hide an undiscovered deposit. It does nothing until someone surveys it and opens a working."
 setting_tfast_sc_economy_off:0 "Off"
 setting_tfast_sc_economy_off_desc:0 "No hidden gold deposits are seeded. Vanilla mines are unchanged."

 rule_tfast_sc_dark_reign:0 "Shattered Crowns: The Long Dark"
 setting_tfast_sc_dark_reign_on:0 "On"
 setting_tfast_sc_dark_reign_on_desc:0 "A Great Reckoning the world loses on any front becomes the Long Dark: plague, famine, poverty, and a Hollow tithe - broken only when the world rises."
 setting_tfast_sc_dark_reign_off:0 "Off"
 setting_tfast_sc_dark_reign_off_desc:0 "A lost Reckoning ends in an ordinary aftermath, exactly as before. The Long Dark never begins."

##############################################################
# DECISIONS -- GOLD
##############################################################
 tfast_sc_question_locals:0 "Question the Capital's People"
 tfast_sc_question_locals_desc:0 "Miners, shepherds, and old men in the market sometimes know a hillside the tax rolls do not. Pay them to talk. A rumor is not a mine."
 tfast_sc_question_locals_tooltip:0 "Ask after gold in your capital county. This may raise an unknown deposit to a rumor. It does not open a mine."
 tfast_sc_question_locals_confirm:0 "Pay for their talk"
 tfast_sc_question_locals_tt:0 "The capital's people are questioned about gold."

 tfast_sc_survey_capital:0 "Survey the Capital for Gold"
 tfast_sc_survey_capital_desc:0 "Hire surveyors to walk the capital county. If a deposit is there, one season of work may learn a little more about it. If they find nothing, that is not proof the ground is empty."
 tfast_sc_survey_capital_tooltip:0 "Survey your capital county. A real deposit may advance one step: rumor, survey, or discovery. Discovery does not build the working."
 tfast_sc_survey_capital_confirm:0 "Hire the surveyors"
 tfast_sc_survey_capital_tt:0 "Surveyors are sent into the capital county."

 tfast_sc_survey_rumored_county:0 "Survey a Rumored County"
 tfast_sc_survey_rumored_county_desc:0 "Somewhere in the counties you hold, gold is already more than a guess. Send surveyors to press that lead one step further."
 tfast_sc_survey_rumored_county_tooltip:0 "Survey one domain county whose gold is rumored or already surveyed, but not yet discovered."
 tfast_sc_survey_rumored_county_confirm:0 "Press the lead"
 tfast_sc_survey_rumored_county_tt:0 "Surveyors are sent to a domain county that already has a gold lead."

 tfast_sc_open_gold_working:0 "Open the Gold Working"
 tfast_sc_open_gold_working_desc:0 "The deposit is known. Sinking a working costs a chest of gold and, once it stands, adds to that county's taxes. It does not mint a second treasury, and it does not move the title."
 tfast_sc_open_gold_working_tooltip:0 "Open a gold working in one discovered domain county. The county's taxes rise with the deposit's richness. An existing vanilla gold mine is not paid a second time."
 tfast_sc_open_gold_working_confirm:0 "Open the working"
 tfast_sc_open_gold_working_tt:0 "A discovered gold deposit in your domain is opened as a working."

##############################################################
# MODIFIERS -- GOLD WORKINGS
##############################################################
 tfast_sc_gold_working_small:0 "Small Gold Working"
 tfast_sc_gold_working_small_desc:0 "A modest gold working. Its yield is collected with the county's ordinary taxes."
 tfast_sc_gold_working_developed:0 "Gold Working"
 tfast_sc_gold_working_developed_desc:0 "A developed gold working. Its yield is collected with the county's ordinary taxes."
 tfast_sc_gold_working_royal:0 "Great Gold Working"
 tfast_sc_gold_working_royal_desc:0 "A great gold working on a rich deposit. Its yield is collected with the county's ordinary taxes."

##############################################################
# EVENTS -- GOLD
##############################################################
 tfast_sc.1000.t:0 "A Rumor of Gold"
 tfast_sc.1000.desc:0 "It is not a proclamation and it is not a map. Someone who lives in [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] has been saying, to anyone who will buy them a drink, that the hills there carry gold. They may be lying. The ground has not been asked yet."
 tfast_sc.1000.a:0 "Have it written down."

 tfast_sc.1001.t:0 "The Surveyors Return"
 tfast_sc.1001.desc.advanced:0 "They come back with dirt in their boots and a clearer account of [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName]. Whatever was known of the gold there is now one step firmer. It is still not a mine."
 tfast_sc.1001.desc.missed:0 "The season was wet, the hills were large, and the people of [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] did not agree with one another. Nothing was confirmed. That is not the same as proof that the ground is empty."
 tfast_sc.1001.desc.empty:0 "The surveyors walked [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] and brought back no vein they would stake their names on. Another season might be bought later. This one found nothing."
 tfast_sc.1001.a:0 "Pay them and file the report."

 tfast_sc.1002.t:0 "The Working Is Open"
 tfast_sc.1002.desc.opened:0 "The first ore comes out of [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] under your authority. It will be taxed with the rest of the county. The title has not moved, and no second treasury has been invented to hold it."
 tfast_sc.1002.desc.already:0 "The ground in [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] is already being worked by an older mine. Opening a second claim on the same hill would count the gold twice. The deposit is marked known, and the taxes stay as they were."
 tfast_sc.1002.a:0 "So be it."

##############################################################
# RESOURCES, SCOUTING, FAMILY CHEST
##############################################################
 tfast_sc_survey_resource:0 "Survey a Resource County"
 tfast_sc_survey_resource_desc:0 "Iron, stone, timber, or grain has already been noticed in a county you hold. Send surveyors to press that lead. The yield, once opened, is collected with the county's taxes."
 tfast_sc_survey_resource_tooltip:0 "Survey one domain county that holds iron, stone, timber, or grain and is not yet discovered."
 tfast_sc_survey_resource_confirm:0 "Send the surveyors"

 tfast_sc_open_resource_working:0 "Open the Resource Working"
 tfast_sc_open_resource_working_desc:0 "The deposit is known. Opening it costs gold and adds to that county's taxes. It does not mint a second treasury."
 tfast_sc_open_resource_working_tooltip:0 "Open a discovered iron, stone, timber, or grain working in your domain."
 tfast_sc_open_resource_working_confirm:0 "Open the working"

 tfast_sc_scout_neighbor:0 "Scout a Neighboring County"
 tfast_sc_scout_neighbor_desc:0 "Send riders across one border you already touch. They can confirm a deposit that is already in the ground. They cannot invent one, and they cannot take the land."
 tfast_sc_scout_neighbor_tooltip:0 "Look at one neighboring county you do not hold. A real deposit may become a rumor. Nothing else changes."
 tfast_sc_scout_neighbor_confirm:0 "Send the riders"

 tfast_sc_set_aside_chest:0 "Set Aside a Family Chest"
 tfast_sc_set_aside_chest_desc:0 "Take 200 gold out of the treasury and set it aside. It is no longer yours to spend. On your death it passes once, to the keeper you named, or to your heir."
 tfast_sc_set_aside_chest_tooltip:0 "Remove 200 gold from the treasury and record it in the family chest."
 tfast_sc_set_aside_chest_confirm:0 "Set it aside"

 tfast_sc_open_chest:0 "Open the Family Chest"
 tfast_sc_open_chest_desc:0 "Return 200 gold from the chest to the treasury. It is the same gold that was set aside."
 tfast_sc_open_chest_tooltip:0 "Put 200 gold from the family chest back into the treasury."
 tfast_sc_open_chest_confirm:0 "Open the chest"

 tfast_sc_name_chest_keeper_interaction:0 "Name Keeper of the Chest"
 tfast_sc_name_chest_keeper_interaction_desc:0 "This person receives the family chest when you die, if they are still alive. The gold stays out of the treasury until then."

 tfast_sc_iron_working:0 "Iron Working"
 tfast_sc_iron_working_desc:0 "An iron working. Its yield is collected with the county's ordinary taxes."
 tfast_sc_stone_working:0 "Stone Working"
 tfast_sc_stone_working_desc:0 "A stone working. Its yield is collected with the county's ordinary taxes."
 tfast_sc_timber_working:0 "Timber Working"
 tfast_sc_timber_working_desc:0 "A timber working. Its yield is collected with the county's ordinary taxes."
 tfast_sc_grain_working:0 "Grain Working"
 tfast_sc_grain_working_desc:0 "A grain working. Its yield is collected with the county's ordinary taxes."

 tfast_sc.1010.t:0 "Word from the Holding"
 tfast_sc.1010.desc.iron:0 "People in [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] have been talking about iron in the ground. It is talk. The ground has not been opened."
 tfast_sc.1010.desc.stone:0 "People in [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] have been talking about building stone. It is talk. No quarry has been cut."
 tfast_sc.1010.desc.timber:0 "People in [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] have been talking about timber worth the cutting. It is talk. No axe has been counted."
 tfast_sc.1010.desc.grain:0 "People in [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] have been talking about grain land that still has a surplus. It is talk. The harvest has not been measured."
 tfast_sc.1010.a:0 "Have it written down."

 tfast_sc.1011.t:0 "The Resource Survey Returns"
 tfast_sc.1011.desc.advanced:0 "The surveyors come back from [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] with a firmer account. It is still not a working."
 tfast_sc.1011.desc.missed:0 "The season in [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] did not confirm the lead. That is not proof the ground is empty."
 tfast_sc.1011.desc.empty:0 "The surveyors found nothing they would stake their names on."
 tfast_sc.1011.a:0 "Pay them and file the report."

 tfast_sc.1012.t:0 "The Working Is Open"
 tfast_sc.1012.desc.iron:0 "Iron is coming out of [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] under your authority. It will be taxed with the rest of the county."
 tfast_sc.1012.desc.stone:0 "Stone is coming out of [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] under your authority. It will be taxed with the rest of the county."
 tfast_sc.1012.desc.timber:0 "Timber is coming out of [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] under your authority. It will be taxed with the rest of the county."
 tfast_sc.1012.desc.grain:0 "The grain of [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName] is being counted with the rest of the county's taxes."
 tfast_sc.1012.a:0 "So be it."

 tfast_sc.1013.t:0 "The Riders Return"
 tfast_sc.1013.desc.found:0 "Across the border, in [ROOT.Char.MakeScope.Var('tfast_sc_rumor_county').Title.GetName], the riders heard the same kind of talk your own holdings sometimes produce. The land is not yours. The talk is written down."
 tfast_sc.1013.desc.empty:0 "The riders crossed one border and brought back no lead worth paying for twice. No land changed hands."
 tfast_sc.1013.a:0 "Pay them and close the report."

