 tfast_sc_released_opinion:0 "Released from Captivity"
 tfast_sc_wall_slighted_opinion:0 "Denied at the Wall"
 tfast_sc_hates_targaryen_opinion:0 "Blood of Darkness's killer"

##############################################################
# THE LONG DARK -- DECISIONS
##############################################################
 tfast_sc_rise_against_the_hollow:0 "Rise Against the Hollow"
 tfast_sc_rise_against_the_hollow_desc:0 "The Long Dark is not a season. Somewhere, the first ruler has to say aloud what everyone is thinking - that the Hollow cannot eat the world if the world refuses to sit still. Speak it."
 tfast_sc_rise_against_the_hollow_tooltip:0 "Add #P 2#! resistance to the Long Dark and gain #P 100#! prestige. The world remembers who moved first."
 tfast_sc_rise_against_the_hollow_confirm:0 "Raise the banner"
 tfast_sc_rise_against_tt:0 "You rise against the Hollow."

 tfast_sc_storm_hollow_stronghold:0 "Storm a Hollow Stronghold"
 tfast_sc_storm_hollow_stronghold_desc:0 "One of the three seats the Hollow keep in the mortal world has a garrison, a gate, and a memory of never being touched. Change the memory."
 tfast_sc_storm_hollow_stronghold_tooltip:0 "Declare war for one Hollow-held stronghold. A host of volunteers (#P 1,200#! levies and #P 150#! bowmen) gathers at your capital."
 tfast_sc_storm_hollow_stronghold_confirm:0 "March on the seat"
 tfast_sc_storm_stronghold_tt:0 "A host marches on a Hollow stronghold."

 tfast_sc_break_the_blockade:0 "Break the Blockade"
 tfast_sc_break_the_blockade_desc:0 "The roads into your walled counties are cut - no grain, no trade, no letters that are not read first. Gold buys escorts, and escorts buy roads."
 tfast_sc_break_the_blockade_tooltip:0 "Pay for armed escorts and lift the blockade from your wall counties."
 tfast_sc_break_the_blockade_confirm:0 "Buy the roads back"
 tfast_sc_break_blockade_tt:0 "The blockade is broken."

 tfast_sc_wall_reinforce:0 "Reinforce the Wall"
 tfast_sc_wall_reinforce_desc:0 "The stones that stand can be made to stand harder: refaced, thickened, and taught to hold a second time."
 tfast_sc_wall_reinforce_tooltip:0 "Reface every wall county. First refit: #P +1#! fort level and stronger defenders. The second refit is stronger still."
 tfast_sc_wall_reinforce_confirm:0 "Set the masons to work"
 tfast_sc_wall_reinforce_tt:0 "The Great Wall is reinforced."

 tfast_sc_wall_dismantle:0 "Dismantle the Wall"
 tfast_sc_wall_dismantle_desc:0 "What one dynasty raised, the same dynasty may take down - stone by stone, and only some of it quietly. The Hollow will hear of it by winter."
 tfast_sc_wall_dismantle_tooltip:0 "Remove every wall modifier, the gates, and the project record. Costs #R 100#! prestige, and nothing is refunded."
 tfast_sc_wall_dismantle_confirm:0 "Take the stones down"
 tfast_sc_wall_dismantle_tt:0 "The Great Wall is dismantled."

##############################################################
# MERCENARIES FOR HIRE
##############################################################
 tfast_sc_hire_free_company:0 "Summon the Carrion Company"
 tfast_sc_hire_free_company_desc:0 "A scarred, one-eyed captain camps at your [capital|E] with two thousand spears and a band of cutthroats. Hire them from #P Military#!, then #P Mercenaries#!, then #P Special Mercenaries#!. The hire button is offered while you are at war."
 tfast_sc_hire_free_company_tooltip:0 "The Carrion Company appears under Special Mercenaries."
 tfast_sc_hire_free_company_confirm:0 "Let them camp"
 tfast_sc_hire_free_company_tt:0 "The Carrion Company appears under Special Mercenaries."

 tfast_sc_hire_great_company:0 "Summon the Unburied Host"
 tfast_sc_hire_great_company_desc:0 "A disfigured host of eight thousand, with horse, camps at your [capital|E]. Hire them from #P Special Mercenaries#! while you are at war."
 tfast_sc_hire_great_company_tooltip:0 "The Unburied Host appears under Special Mercenaries."
 tfast_sc_hire_great_company_confirm:0 "Let them camp"
 tfast_sc_hire_great_company_tt:0 "The Unburied Host appears under Special Mercenaries."

 tfast_sc_hire_host_of_fortune:0 "Summon the Pale Reckoning"
 tfast_sc_hire_host_of_fortune_desc:0 "An albino captain and twenty thousand pale cloaks camp at your [capital|E]. Hire them from #P Special Mercenaries#! while you are at war."
 tfast_sc_hire_host_of_fortune_tooltip:0 "The Pale Reckoning appears under Special Mercenaries."
 tfast_sc_hire_host_of_fortune_confirm:0 "Let them camp"
 tfast_sc_hire_host_of_fortune_tt:0 "The Pale Reckoning appears under Special Mercenaries."

