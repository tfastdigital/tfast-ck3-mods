# THE IN-GAME HANDBOOK
##############################################################
 tfast_sc_help_open:0 "TFAST Handbook: Open"
 tfast_sc_help_open_desc:0 "Open the handbook: eight chapters on how this mod actually works, what every warning means, and what each decision costs."
 tfast_sc_help_open_tooltip:0 "$tfast_sc_help_open_desc$"
 tfast_sc_help_open_confirm:0 "Open the handbook"

 tfast_sc_help_close:0 "TFAST Handbook: Close"
 tfast_sc_help_close_desc:0 "Close the handbook."
 tfast_sc_help_close_tooltip:0 "$tfast_sc_help_close_desc$"
 tfast_sc_help_close_confirm:0 "Close"

 tfast_sc_help_page_start:0 "Handbook: Getting Started"
 tfast_sc_help_page_start_desc:0 "What this mod does: the Hollow Dominion wakes with the world and starts raiding. You survive, fortify, and either win the Reckoning or live through the Long Dark.\n\nFirst steps:\n- Watch for raid warnings. A Hollow raid gives you days of warning and a stance choice.\n- Build the Great Wall early: it blocks scripted raids until the gate is breached.\n- Watch the events for the crisis states: predatory peace, escalation, the Reckoning itself.\n\nIf the Dominion ever fails to appear (exotic load orders, converted saves), the decision #P Raise the Hollow Dominion#! appears once to repair it.\n\nGame rules set before the campaign: Reckoning timing (Early/Standard/Late), Hollow strength, the Chosen Emperor, hidden gold, and the Long Dark."
 tfast_sc_help_page_start_tooltip:0 "$tfast_sc_help_page_start_desc$"
 tfast_sc_help_page_start_confirm:0 "Close the chapter"

 tfast_sc_help_page_dominion:0 "Handbook: The Hollow Dominion"
 tfast_sc_help_page_dominion_desc:0 "The Supreme Immortal Overlord and his ten original children sit in island strongholds taken from AI rulers. They are AI-only, never permanently destroyable (death is banishment; the Overlord can only be sealed), and their dynasty is closed by faith.\n\nThe Ten carry ambitions, loyalty, grievance and influence that drift every year, form blocs, and can rise in rare rebellion against the Overlord.\n\nWhat they want matters: every year the Host picks a goal - treasure, blood, terror, the hunt, or vendetta - and acts on it. See chapter 7."
 tfast_sc_help_page_dominion_tooltip:0 "$tfast_sc_help_page_dominion_desc$"
 tfast_sc_help_page_dominion_confirm:0 "Close the chapter"

 tfast_sc_help_page_raids:0 "Handbook: Raids and Defense"
 tfast_sc_help_page_raids_desc:0 "A Hollow raid is scripted, not a native army: you always get a warning event and a stance choice.\n\n- #italic Ride out#!: best defense, worst losses if it fails.\n- #italic Trust the walls#!: the safer middle.\n\nOutcomes:\n- #P Defended#!: the raid is thrown back; the raider remembers you, and a vendetta may follow.\n- #P Contested#!: they take a cut of your gold and leave.\n- #P Overrun#!: gold, county control, the Stripped by the Hollow modifier - and sometimes prisoners or Kaedryn's frost.\n\nA closed Great Wall gate blocks the raid entirely until the wall is breached. During the Long Dark, every thrown-back raid feeds the resistance."
 tfast_sc_help_page_raids_tooltip:0 "$tfast_sc_help_page_raids_desc$"
 tfast_sc_help_page_raids_confirm:0 "Close the chapter"

 tfast_sc_help_page_wall:0 "Handbook: The Great Wall"
 tfast_sc_help_page_wall_desc:0 "Five stages, paid one by one: planning (100), towers (150), rampart (250), gates (200), wards (300 piety). Each stage raises the wall's defense value and adds county modifiers across your capital's duchy.\n\nThe wall needs upkeep: fund it (100 gold for 10 years), or the stones weather and the gate can fail. Repair costs 150 gold and restores integrity.\n\nExtra decisions:\n- #P Reinforce#!: two refits (300 gold each) raise fort level and defenders on every wall county.\n- #P Dismantle#!: tear your own project down (-100 prestige, no refund).\n- #P Break the Blockade#!: the Long Dark can cut your roads; 100 gold reopens them.\n\nWhile the gates stand, #italic scripted#! Hollow raids cannot pass. Real armies can still besiege the counties - no mod can wall off the map."
 tfast_sc_help_page_wall_tooltip:0 "$tfast_sc_help_page_wall_desc$"
 tfast_sc_help_page_wall_confirm:0 "Close the chapter"

 tfast_sc_help_page_reckoning:0 "Handbook: The Great Reckoning"
 tfast_sc_help_page_reckoning_desc:0 "Three raids (or a lost stronghold) start the escalation, and the world is foretold two years before the storm.\n\nThe Reckoning is a real war with a script-only casus belli: one primary front (usually the human player) and up to two waves of invasion. You can win it, outlast it, or lose ground - all three change what follows.\n\n- Win or hold: the Host retreats; a long cooldown follows; the prophecy of the Chosen Emperor can open.\n- Lose a front: the Long Dark begins (unless the game rule is off).\n- The Overlord is never killed - only sealed (15 years), during which the Ten rule an Eternal Regency.\n\nThe World Council pledge, offered once the Reckoning is foretold, gives a standing bonus and feeds the world's resistance."
 tfast_sc_help_page_reckoning_tooltip:0 "$tfast_sc_help_page_reckoning_desc$"
 tfast_sc_help_page_reckoning_confirm:0 "Close the chapter"

 tfast_sc_help_page_dark:0 "Handbook: The Long Dark and the Uprising"
 tfast_sc_help_page_dark_desc:0 "A Reckoning the world loses becomes the Long Dark: plague, famine and poverty spread county by county, courts lose people, a Hollow tithe demands your gold, your walls are blockaded and assaulted stage by stage, and the Host hunts and feeds as it likes.\n\nTwo decisions are your answers:\n- #P Rise Against the Hollow#!: +2 resistance every two years.\n- #P Storm a Hollow Stronghold#!: a real war for one of the three seats (+3 resistance when a seat changes hands).\n\nDefended raids (+1) and walls that hold (+1) also count. At 8 resistance (or 20 dark years) the world rises; at 14 the dark breaks: the Host retreats, the prophecy reopens, and those who stood keep the Spirit of the Uprising."
 tfast_sc_help_page_dark_tooltip:0 "$tfast_sc_help_page_dark_desc$"
 tfast_sc_help_page_dark_confirm:0 "Close the chapter"

 tfast_sc_help_page_goals:0 "Handbook: The Host's Goals and Hiding"
 tfast_sc_help_page_goals_desc:0 "The Overlord and the Ten act on what they want:\n\n- #P Treasure#!: the default appetite - raids for gold.\n- #P Blood#!: the Host feeds on a neighbour (development and lives) to restore readiness.\n- #P Terror#!: dread campaigns that break a county to make an example.\n- #P Hunt#!: someone is hiding - the Host goes looking.\n- #P Vendetta#!: whoever made the Host lose (a war or a thrown-back raid) is marked and raided hard for 50 years.\n\nYour counter-decision is #P Go Into Hiding#! (150 prestige, 5 years): raids pass you over while it lasts. It is time, not safety - if the Host's goal is the hunt, the hidden are found."
 tfast_sc_help_page_goals_tooltip:0 "$tfast_sc_help_page_goals_desc$"
 tfast_sc_help_page_goals_confirm:0 "Close the chapter"

 tfast_sc_help_page_realm:0 "Handbook: Your Toolbox"
 tfast_sc_help_page_realm_desc:0 "Mercenaries (any land, any ruler): Free Company 250 gold -> 2,000 levies + 250 bowmen; Great Company 800 -> 8,000 + 500 + 500 horse; Host of Fortune 2,000 -> 20,000 + 1,000 + 1,000. One hire puts all tiers on a two-year cooldown; they starve and die like any army.\n\nThe #P Automation Menu#! runs the realm for you: maintain and reinforce the wall, rebuild stripped counties, tell the tale, rise against the Hollow, break blockades, hire mercenaries in wartime - each switch at decision prices, always keeping a gold reserve.\n\nMemory: when you throw back a raid, hold a wall, or survive a breach, a memory is recorded. #P Tell the Tale#! turns it into prestige and standing.\n\nEconomy: rumor decisions find hidden gold and other deposits (game rule); the family chest and inheritance live in their own events.\n\nCompanion mods: #P TFAST AI Suite#! carries the cheat menu (open it from the Decisions tab) and right-click grants for any ruler - including AI rulers you want to help. #P TFAST History#! adds dated historical acts for Korea, China, England and Europe."
 tfast_sc_help_page_realm_tooltip:0 "$tfast_sc_help_page_realm_desc$"
 tfast_sc_help_page_realm_confirm:0 "Close the chapter"

 tfast_sc_help_page_back:0 "Handbook: Back"
 tfast_sc_help_page_back_desc:0 "Back to the chapter list."
 tfast_sc_help_page_back_tooltip:0 "$tfast_sc_help_page_back_desc$"
 tfast_sc_help_page_back_confirm:0 "Back"

