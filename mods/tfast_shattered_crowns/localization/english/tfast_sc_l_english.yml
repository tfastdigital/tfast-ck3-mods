##############################################################
 tfast_sc.0920.t:0 "An Omen of the Long Dark"
 tfast_sc.0920.desc:0 "The dark brings its own signs, and the court has learned to read them."
 tfast_sc.0920.a:0 "Say nothing."
 tfast_sc.0921.t:0 "Whispers at Court"
 tfast_sc.0921.desc:0 "The court trades rumors about the Hollow the way other courts trade grain - carefully, and never in writing."
 tfast_sc.0921.a:0 "Let them talk."

