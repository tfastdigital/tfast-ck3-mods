 tfast_cheat_clear_tyranny_confirm:0 "Forget my sins"

 tfast_cheat_golden_age:0 "Cheat: Golden Age"
 tfast_cheat_golden_age_desc:0 "Everything, at once. Maximum resources, a fully developed realm, larger armies, and a #P 20-year#! realm-wide boon."
 tfast_cheat_golden_age_tt:0 "Grant #P 10000#! [gold|E], [prestige|E], [piety|E] and [renown|E], #P 1000#! [legitimacy|E], #P 150#! [dread|E], clear all [tyranny|E] and [stress|E], and add #P 2#! [development|E] to every [county|E]."
