 tfast_auto_council_on_desc:0 "Fill empty council seats from your court. The steward develops your land, or collects taxes when gold is under 400. The marshal raises control, then trains commanders. The chancellor soothes vassals. The spymaster watches for schemes. The chaplain converts a county of another faith."
